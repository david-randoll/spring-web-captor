name: Publish Captor to GitHub Packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed release version
        required: true
        default: '1.2.1'
permissions:
  contents: read
  packages: write
concurrency:
  group: captor-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          server-id: github
      - name: Match the reviewed version
        run: |
          python3 - <<'PY'
          import os, re, xml.etree.ElementTree as ET
          root=ET.parse('pom.xml').getroot(); ns={'m':'http://maven.apache.org/POM/4.0.0'}
          version=root.find('m:properties/m:revision',ns).text
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+',version)
          assert version == os.environ['RELEASE_VERSION']
          PY
      - run: mvn -B -ntp clean verify -Pgithub
      - run: mvn -B -ntp org.apache.maven.plugins:maven-enforcer-plugin:3.5.0:enforce -Drules=requireReleaseDeps,requireReleaseVersion
      - run: mvn -B -ntp deploy -Pgithub -DskipTests -DdeployAtEnd=true
